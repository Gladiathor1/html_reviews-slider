<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
    <style>
        body {
            max-width: 994px;
            margin: auto;
            width: 100%;
        }
    </style>
</head>

<body>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css"
        integrity="sha512-1sCRPdkRXhBV2PBLUdRb4tMg1w2YPf37qatUFeS7zlBy7jJI8Lf4VHwWfZZfpXtYSLy85pkm9GaYVYMfw5BC1A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <section class="title-bar">
        <div class="top-title">
            <h3>Limited-time-only summer deaks</h3>
        </div>
        <div class="bottom-title">
            <h2>Warehouse Sale: Up to 70% off</h2>
            <a href="#" class="btn-ba">Shop now <i class="fa-solid fa-right-long"></i></a>
        </div>
    </section>

    <!-- Catagories Slider -->
    <section class="slider-main">
        <div class="catagories-slider-ba">
            <div class="catagory-slide">
                <img src="https://wtwp.com/wp-content/uploads/2015/06/placeholder-image.png" alt="Review Image">
                <a href="#">Up to 40% off living room furniture</a>
            </div>

            <div class="catagory-slide">
                <img src="https://wtwp.com/wp-content/uploads/2015/06/placeholder-image.png" alt="Review Image">
                <a href="#">Up to 40% off living room furniture</a>
            </div>

            <div class="catagory-slide">
                <img src="https://wtwp.com/wp-content/uploads/2015/06/placeholder-image.png" alt="Review Image">
                <a href="#">Up to 40% off living room furniture</a>
            </div>

            <div class="catagory-slide">
                <img src="https://wtwp.com/wp-content/uploads/2015/06/placeholder-image.png" alt="Review Image">
                <a href="#">Up to 40% off living room furniture</a>
            </div>

            <div class="catagory-slide">
                <img src="https://wtwp.com/wp-content/uploads/2015/06/placeholder-image.png" alt="Review Image">
                <a href="#">Up to 40% off living room furniture</a>
            </div>
        </div>
        <div class="slider-navagation">
            <span class="btn-left" onclick="slideright()"><i class="fa-solid fa-angle-left"></i></span>
            <span class="btn-right" onclick="slideleft()"><i class="fa-solid fa-chevron-right"></i></span>
        </div>
    </section>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@300&family=Roboto&display=swap');

        .title-bar {
            background-color: brown;
            color: #fff;
            padding: 80px 40px;
            font-family: 'IBM Plex Serif', serif;
            font-weight: 400;
        }

        .bottom-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-bar h3,
        .title-bar h2 {
            margin: 0;
        }

        .btn-ba {
            border: 1px solid #fff;
            padding: 10px 20px;
            color: #fff;
            text-decoration: none;
        }

        .catagories-slider-ba {
            display: -webkit-box;
            gap: 10px;
            overflow: auto;
            margin-top: 30px;
            scroll-behavior: smooth;
            position: relative;
            padding-bottom: 20px;
        }

        .catagories-slider-ba::-webkit-scrollbar {
            width: 2px;
            height: 4px;
        }

        .catagory-slide a {
            font-size: 16px;
            color: black;
        }

        .catagories-slider-ba::-webkit-scrollbar-track {
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.3);
        }

        .catagories-slider-ba::-webkit-scrollbar-thumb {
            background-color: darkgrey;
            outline: 0px solid slategrey;
            height: 1px;
        }

        .catagories-slider-ba>div {
            width: 24%;
        }

        .catagories-slider-ba>div>img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .slider-navagation span {
            cursor: pointer;
            display: inline-table;
            position: absolute;
            top: 0;
            bottom: 0;
            margin: auto;
            font-size: 20px;
        }

        .btn-left {
            left: 0;
        }

        .btn-right {
            right: 0;
        }

        .slider-main {
            position: relative;
        }

        @media only screen and (max-width: 1024px) {
            .catagories-slider-ba>div {
                width: 49%;
            }
        }

        @media only screen and (max-width: 767px) {
            .catagories-slider-ba>div {
                width: 100%;
            }
        }
    </style>

    <script>
        function slideleft() {
            if (window.innerWidth < 767) {
                document.getElementsByClassName("catagories-slider-ba")[0].scrollLeft += window.innerWidth;
            }
            else if (window.innerWidth < 1024) {
                document.getElementsByClassName("catagories-slider-ba")[0].scrollLeft += (window.innerWidth / 2);
            }
            else {
                document.getElementsByClassName("catagories-slider-ba")[0].scrollLeft += (238 * 2);
            }
        }
        function slideright() {
            if (window.innerWidth < 767) {
                document.getElementsByClassName("catagories-slider-ba")[0].scrollLeft -= window.innerWidth;
            }
            if (window.innerWidth < 1024) {
                document.getElementsByClassName("catagories-slider-ba")[0].scrollLeft -= (window.innerWidth / 2);
            }
            else {
                document.getElementsByClassName("catagories-slider-ba")[0].scrollLeft -= (238 * 2)
            }
        }
    </script>
</body>

</html>
