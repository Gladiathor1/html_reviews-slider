    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto&display=swap');

        .catagories-slider-ba-2 {
            display: -webkit-box;
            gap: 10px;
            overflow: auto;
            margin-top: 30px;
            scroll-behavior: smooth;
            position: relative;
            padding-bottom: 20px;
            font-family: 'Roboto', sans-serif;
        }

        .catagories-slider-ba-2::-webkit-scrollbar {
            width: 2px;
            height: 4px;
        }

        .catagory-slide a {
            font-size: 16px;
            color: black;
        }

        .catagories-slider-ba-2::-webkit-scrollbar-track {
            box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.3);
        }

        .catagories-slider-ba-2::-webkit-scrollbar-thumb {
            background-color: darkgrey;
            outline: 0px solid slategrey;
            height: 1px;
        }

        .catagories-slider-ba-2>div {
            width: 16%;
        }

        .catagories-slider-ba-2>.crazy-earth-best-sellers>img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .slider-navagation span {
            cursor: pointer;
            display: inline-table;
            position: absolute;
            top: 0;
            bottom: 0;
            margin: auto;
            font-size: 20px;
        }

        .btn-left {
            left: -10px;
        }

        .catagory-slide.crazy-earth-best-sellers h4 {
            margin: 0;
        }

        .btn-right {
            right: -10px;
        }

        .slider-main {
            position: relative;
        }

        .swatches {
            display: flex;
            gap: 10px;
        }

        .swatches>.sw>img {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .swatches>.sw.new:after {
            content: "new";
            font-size: 10px;
            text-transform: uppercase;
        }

        span.cancle {
            text-decoration: line-through;
            color: brown;
        }

        @media only screen and (max-width: 1024px) {
            .catagories-slider-ba-2>div {
                width: 49%;
            }

            .btn-left {
                left: 0px;
            }

            .btn-right {
                right: 00px;
            }
        }

        @media only screen and (max-width: 767px) {
            .catagories-slider-ba-2>div {
                width: 100%;
            }

            .catagories-slider-ba-2 {
                gap: 5px;
            }
        }
    </style>

    <script>
        document.getElementById("btn-right-sellers").addEventListener("click", function () {
            if (window.innerWidth < 767) {
                document.getElementsByClassName("catagories-slider-ba-2")[0].scrollLeft += window.innerWidth;
            }
            else if (window.innerWidth < 1024) {
                document.getElementsByClassName("catagories-slider-ba-2")[0].scrollLeft += (window.innerWidth / 2);
            }
            else {
                document.getElementsByClassName("catagories-slider-ba-2")[0].scrollLeft += (160 * 2);
            }
        })
        document.getElementById("btn-left-sellers").addEventListener("click", function(){
            if (window.innerWidth < 767) {
                document.getElementsByClassName("catagories-slider-ba-2")[0].scrollLeft -= window.innerWidth;
            }
            if (window.innerWidth < 1024) {
                document.getElementsByClassName("catagories-slider-ba-2")[0].scrollLeft -= (window.innerWidth / 2);
            }
            else {
                document.getElementsByClassName("catagories-slider-ba-2")[0].scrollLeft -= (160 * 2)
            }
        })
    </script>
